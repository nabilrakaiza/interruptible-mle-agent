[project]
name = "imle"
version = "0.1.0"
description = "Interruptible MLE agent with human intervention in tree search"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",          # client for OpenRouter and Gemini (OpenAI-compatible APIs)
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "pandas",
    "numpy",
    "streamlit>=1.37",   # st.fragment(run_every=...)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# What generated scripts may import (agents/coding.py PACKAGES); needed for --sandbox subprocess.
sandbox = ["numpy", "pandas", "scipy", "scikit-learn", "pillow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pin exact versions after the pilot run, for reproducibility.
