# Shared defaults. Condition files override these.
budget:
  wall_clock_s: 14400        # 4 hours
  script_timeout_s: 3600
  max_nodes: 200
search:
  policy: greedy
  num_drafts: 5
  debug_prob: 0.5
  max_debug_depth: 3
  improve_patience: 3
  improve_min_rel_gain: 0.001
splits:
  probe_fraction: 0.1
final_selection: best_val    # best_val | top_k | override
agents:
  evaluation: true
  retrieval: true
  reflection: true
llm:
  model: ${LLM_MODEL}
  temperature: 0.7
