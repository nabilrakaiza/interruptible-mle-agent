# Shared defaults. Condition files override these.
budget:
  wall_clock_s: 14400        # 4 hours
  script_timeout_s: 3600
  max_nodes: 200
search:
  policy: greedy
  num_drafts: 5
  debug_prob: 0.5
  max_debug_depth: 3
  improve_patience: 3
  improve_min_rel_gain: 0.001
splits:
  probe_fraction: 0.1
final_selection: best_val    # best_val | top_k | override
top_k: 3                     # submissions kept when final_selection is top_k
agents:
  evaluation: true
  retrieval: true
  reflection: true
retrieval:                   # A2, used when agents.retrieval is true
  source: web                # web: cards written from allowlisted docs | static: hand-written cards only
  cache_dir: data/retrieval_cache  # fetched pages, shared by runs so every run reads the same text
  max_cards: 8
llm:
  provider: openrouter       # openrouter (experiments) | gemini (local testing)
  model: ${LLM_MODEL}        # unset or empty: the provider's default, see imle/llm.py
  temperature: 0.7
  effort: high               # reasoning depth: low | medium | high
  max_tokens: 64000
sandbox:
  backend: docker            # docker | subprocess (no isolation, local testing only)
  image: imle-sandbox:latest # needs Python plus the packages in agents/coding.py
