# Shared defaults. Condition files override these.
budget:
  wall_clock_s: 7200         # 2 hours; extend a finished run with --resume --budget-hours
  script_timeout_s: 1200     # 20 min: a small CNN on 2 CPUs fits; one script cannot eat half a 2-hour run
  max_nodes: 200
search:
  policy: greedy
  num_drafts: 5
  debug_prob: 0.5
  max_debug_depth: 3
  improve_patience: 3
  improve_min_rel_gain: 0.001
  explore_prob: 0.15         # chance an improve goes to a random non-best node; 0 is plain AIDE greedy
splits:
  probe_fraction: 0.1
final_selection: best_val    # best_val | top_k | override
top_k: 3                     # submissions kept when final_selection is top_k
policies:                    # thresholds of the scripted monitors a condition names in `monitors`
  divergence_prune:          # C4, see imle/policies/divergence_prune.py
    min_steps: 2             # working nodes after the lineage's best-probe node
    min_val_gain: 0.01       # relative validation gain since that node
    min_probe_loss: 0.01     # relative probe loss since that node
    consistent_share: 0.95   # paired bootstrap resamples the probe loss must hold in
    bootstrap_samples: 1000
agents:
  evaluation: true
  retrieval: true
  reflection: true
reflection:                  # A4, used when agents.reflection is true
  every_n: 10                # finished nodes between phase boundaries, after the first num_drafts
  max_findings: 10           # findings kept (newest); each call adds at most 3
  max_retries: 2             # extra attempts when A4's reply is not valid JSON
retrieval:                   # A2, used when agents.retrieval is true
  source: web                # web: cards written from allowlisted docs | static: hand-written cards only
  cache_dir: data/retrieval_cache  # fetched pages, shared by runs so every run reads the same text
  max_cards: 8
llm:
  provider: openrouter       # openrouter (experiments) | gemini (local testing)
  model: ${LLM_MODEL}        # unset or empty: the provider's default, see imle/llm.py
  temperature: 0.7
  effort: high               # reasoning depth: low | medium | high
  max_tokens: 64000
  routing:                   # OpenRouter provider routing, sent as its `provider` object (openrouter only)
    sort: price              # each call goes to the cheapest available provider, then the next cheapest
    quantizations: [fp8]     # one precision for every call, so all conditions see the same weights
    max_price: {prompt: 0.15, completion: 0.30}  # USD per million tokens; above it calls fail, not cost more
  outage_retries: 5          # failed LLM calls in a row before the run stops (resumable with --resume)
  outage_wait_s: 30          # wait after a failed call, doubling each time, at most 5 minutes
sandbox:
  backend: docker            # docker | subprocess (no isolation, local testing only)
  image: imle-sandbox:latest # needs Python plus the packages in agents/coding.py
  cpus: 2                    # limits stated in A3's prompt; role 1's Docker sandbox should enforce the same
  memory_gb: 4
